[project]
name = "memframe"
version = "0.1.0"
description = "memFrame is a Python package for working with database-backed DataFrame operations. It lets you upload CSV files, Parquet files, and pandas DataFrames into a local DuckDB database or a remote PostgreSQL/Clickhouse database, then run DataFrame-style inspection, selection, cleaning, and table-management operations through one consistent API."
readme = "README.md"
authors = [
    { name = "Debojit", email = "debo.mandal95@gmail.com" }
]
requires-python = ">=3.10"
license = "AGPL-3.0"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "asyncpg>=0.30",
    "chardet>=7.4.3",
    "clickhouse-connect>=1.4.2",
    "duckdb>=1.0.0",
    "httpx>=0.28.1",
    "kaleido>=0.2.1",
    "pandas>=2.2,<3.0",
    "plotly>=6.9.0",
    "pyarrow>=24.0.0",
    "pydantic>=2.13.4",
]

[project.optional-dependencies]
ai = [
    "pydantic-ai>=2.22.0",
    "pydantic-ai-harness[codemode]>=0.1",
    "pydantic-settings>=2.0",
]
dev = [
    "build>=1.0",
    "matplotlib>=3.10.9",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "tox>=4.0",
    "twine>=6.0",
    "mkdocs-material>=9.7.6",
    "mkdocstrings[python]>=1.0.4",
]

[project.urls]
Homepage = "https://github.com/Debojit95/memFrame"
Documentation = "https://debojit95.github.io/memFrame/"
Repository = "https://github.com/Debojit95/memFrame"
Issues = "https://github.com/Debojit95/memFrame/issues"

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "unit: fast, dependency-free unit tests",
    "cache: cache manager and two-level cache behavior",
    "integration: tests requiring a real database backend",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memframe", "src/memframe_ai"]
