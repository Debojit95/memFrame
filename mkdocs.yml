site_name: memFrame
site_description: Data analytics with database-backed DataFrame operations
site_url: https://debojit95.github.io/memFrame/

theme:
  name: material
  logo: assets/logo-nav-light.png
  favicon: assets/logo-nav-light.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            docstring_style: google
            show_source: false

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Getting Started: getting-started.md
  - Testing: testing.md
  - Contributing: CONTRIBUTING.md
  - Code of Conduct: CODE_OF_CONDUCT.md
  - API:
      - Caching: api/caching.md
      - DB Manager:
          - Connector: api/connector.md
          - Upload Manager: api/upload-manager.md
          - Sync Existing Tables: api/syncdb.md
          - Dataset Operations: api/database.md
      - memFrame:
            - Overview: api/memframe.md
      - Inspect:
          - Inspect: api/inspect.md
      - Clean:
          - Clean: api/cleaning.md
      - Arithmetic:
          - Arithmetic: api/arithmetic.md
      - Cumulative:
          - Cumulative: api/cumulative.md
      - Window:
          - Window: api/window.md
      - GroupBy:
          - GroupBy Stats: api/groupby/groupby_stats.md
      - Selection:
          - Selection: api/selection.md
      - Stats:
          - Stats: api/stats.md
      - Datetime:
          - Datetime: api/datetime.md
      - Sorting:
          - Sorting: api/sorting.md
      - Reshape:
          - Reshape: api/reshape.md
      - Merge:
          - Merge: api/merging.md
      - Transform:
          - Transform: api/transform.md
      - Plots:
          - Bar: api/bar.md
          - Bar Polar: api/bar_polar.md
          - Pie: api/pie.md
          - Line: api/line.md
          - Scatter: api/scatter.md
          - Scatter 3D: api/scatter3d.md
  - memframe_ai:
      - Agent: memframe-ai/agent.md
      - Dashboard: memframe-ai/dashboard.md
      - Observability: memframe-ai/observability.md
