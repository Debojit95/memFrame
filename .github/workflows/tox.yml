name: Tox

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tox:
    name: Tox py310-py313
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.10 3.11 3.12 3.13
      - run: uvx tox -e py310,py311,py312,py313 -p auto -- tests/unit
